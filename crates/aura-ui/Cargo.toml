[package]
name        = "aura-ui"
description = "Aura control panel UI — communicates with wallpaperd via IPC only"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[[bin]]
name = "wallpaper-ui"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# ---------------------------------------------------------------------------
# DEPENDENCY BOUNDARY ENFORCEMENT
#
# aura-ui MUST NOT depend on:
#   - aura-media   (media decoding internals)
#   - aura-win     (Win32 desktop integration)
#   - aura-vulkan  (GPU rendering)
#
# Verify with: cargo tree -p aura-ui
# ---------------------------------------------------------------------------
[dependencies]
aura-core  = { workspace = true }
aura-ipc   = { workspace = true }
aura-storage = { workspace = true }

eframe        = { workspace = true }
egui          = { workspace = true }
egui_extras   = { workspace = true }
egui-phosphor = "0.13"
rfd           = "0.15"

serde             = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
tokio             = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
]
